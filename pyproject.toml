[project]
name = "junaid-notebook-workflow"
version = "0.1.0"
description = "Repository-local research notebook workflow for junaid.foo"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.uv]
package = false
