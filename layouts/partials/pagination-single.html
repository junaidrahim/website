{{- /* Previous and next pages in the section, stacked and left-aligned with the text. */ -}}
{{ if or .NextInSection .PrevInSection }}
<nav class="single-pagination" aria-label="Previous and next">
  {{- with .PrevInSection }}
  <p><span aria-hidden="true">←</span> <a href="{{ .RelPermalink }}">{{ .Title }}</a></p>
  {{- end }}
  {{- with .NextInSection }}
  <p><a href="{{ .RelPermalink }}">{{ .Title }}</a> <span aria-hidden="true">→</span></p>
  {{- end }}
</nav>
{{ end }}
