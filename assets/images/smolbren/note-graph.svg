<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">The Dispossessed note expanded into a typed knowledge graph</title>
  <desc id="desc">A highlighted book note connects through author, themes, and related frontmatter fields to Ursula K. Le Guin, anarchism, utopia, and The Left Hand of Darkness.</desc>
  <style>
    :root {
      color-scheme: light dark;
      --paper: #ffffff;
      --ink: #242424;
      --graphite: #757575;
      --rule: #b0b0b0;
      --wash: #f9f9f9;
      --fountain: #385568;
      --fountain-wash: #e9eff2;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #141414;
        --ink: #dadada;
        --graphite: #8c8c8c;
        --rule: #606060;
        --wash: #1e1e1e;
        --fountain: #86a9ba;
        --fountain-wash: #1e2b31;
      }
    }

    .serif {
      fill: var(--ink);
      font-family: "Iowan Old Style", Georgia, Cambria, serif;
    }

    .mono {
      fill: var(--graphite);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
    }

    .edge-label {
      fill: var(--ink);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
    }

    .note {
      fill: var(--fountain-wash);
      stroke: var(--fountain);
      stroke-width: 1.5;
    }

    .node {
      fill: var(--paper);
      stroke: var(--rule);
      stroke-width: 1;
    }

    .rule {
      fill: none;
      stroke: var(--rule);
      stroke-width: 1;
    }

    .edge {
      fill: none;
      stroke: var(--ink);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.35;
    }

    .accent { fill: var(--fountain); }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 8 4 0 8" fill="none" stroke="var(--ink)" stroke-width="1.2" />
    </marker>
  </defs>

  <text class="mono" x="34" y="30">01 / one note, four relationships</text>
  <text class="mono" x="726" y="30" text-anchor="end">frontmatter → graph</text>
  <path class="rule" d="M34 44H726" />

  <g aria-label="The Dispossessed book note">
    <rect class="note" x="38" y="92" width="262" height="262" rx="3" />
    <path class="rule" d="M38 155H300" />
    <text class="mono" x="58" y="119">/books/the-dispossessed</text>
    <text class="serif" x="58" y="143" font-size="23" font-weight="600">The Dispossessed</text>

    <text class="mono" x="58" y="187">type</text>
    <text class="edge-label accent" x="148" y="187">book</text>
    <text class="mono" x="58" y="225">author</text>
    <text class="edge-label" x="148" y="225">Ursula K. Le Guin</text>
    <text class="mono" x="58" y="263">themes</text>
    <text class="edge-label" x="148" y="263">anarchism, utopia</text>
    <text class="mono" x="58" y="301">related</text>
    <text class="edge-label" x="148" y="301">The Left Hand…</text>
    <text class="mono" x="58" y="333">markdown note</text>
  </g>

  <g aria-label="Person node">
    <rect class="node" x="493" y="64" width="228" height="64" rx="2" />
    <text class="mono" x="511" y="88">person</text>
    <text class="serif" x="511" y="113" font-size="18">Ursula K. Le Guin</text>
  </g>

  <g aria-label="Anarchism topic node">
    <rect class="node" x="493" y="156" width="184" height="58" rx="2" />
    <text class="mono" x="511" y="180">topic</text>
    <text class="serif" x="511" y="202" font-size="17">anarchism</text>
  </g>

  <g aria-label="Utopia topic node">
    <rect class="node" x="493" y="237" width="184" height="58" rx="2" />
    <text class="mono" x="511" y="261">topic</text>
    <text class="serif" x="511" y="283" font-size="17">utopia</text>
  </g>

  <g aria-label="Related book node">
    <rect class="node" x="445" y="330" width="276" height="64" rx="2" />
    <text class="mono" x="463" y="354">book</text>
    <text class="serif" x="463" y="379" font-size="18">The Left Hand of Darkness</text>
  </g>

  <path class="edge" d="M300 218H380V96H485" marker-end="url(#arrow)" />
  <text class="edge-label" x="390" y="88">author</text>

  <path class="edge" d="M300 256H392V185H485" marker-end="url(#arrow)" />
  <text class="edge-label" x="402" y="177">themes</text>

  <path class="edge" d="M300 266H485" marker-end="url(#arrow)" />
  <text class="edge-label" x="418" y="255">themes</text>

  <path class="edge" d="M300 294H371V362H437" marker-end="url(#arrow)" />
  <text class="edge-label" x="380" y="354">related</text>

  <circle cx="300" cy="218" r="3" class="accent" />
  <circle cx="300" cy="256" r="3" class="accent" />
  <circle cx="300" cy="266" r="3" class="accent" />
  <circle cx="300" cy="294" r="3" class="accent" />
</svg>
